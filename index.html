<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="json.js"></script>


</head>

<body onload="init()">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="main-site">
        <div class="card question-card">

            <div class="card-body" id="end-screen" style="display: none;">
                <span class="end-screen-titel">Quis beendet</span>
                <img class="width-100" src="./assets/images/youWon.png">
                <span class="end-screen-text">du hast <b id="end-right-answers"> </b> von <b id="end-answers"> </b> Fragen
                    richtig
                    beantwortet.</span>
                    <div class="button-center">
                        <button onclick="restartGame()" class="btn btn-primary">Erneut spielen</button>
                    </div>

            </div>




            <img id="card-img-top" src="./assets/images/quizz-app-card.png" class="card-img-top">

            <div class="progress" role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0"
                aria-valuemax="100">
                <div class="progress-bar text-bg-info" style="width: 0%" id="progress-bar">%</div>
            </div>

            <div class="card-body" id="question-body">
                <h5 id="question-1" class="card-title">Frage:</h5>

                <div class="card answer-block mb-2">
                    <div id="answer-1" class="card-body" onclick="answer('answer-1')">
                        Antwort
                    </div>
                </div>

                <div class="card answer-block mb-2">
                    <div id="answer-2" class="card-body" onclick="answer('answer-2')">
                        Antwort
                    </div>
                </div>

                <div class="card answer-block mb-2">
                    <div id="answer-3" class="card-body" onclick="answer('answer-3')">
                        Antwort
                    </div>
                </div>

                <div class="card answer-block mb-2">
                    <div id="answer-4" class="card-body" onclick="answer('answer-4')">
                        Antwort
                    </div>
                </div>
                <div class="question-footer">
                    <span><strong id="current-question-number"></strong>von<strong id="all-questions"></strong></span>
                    <button class="btn btn-primary" id="next-button" disabled
                        onclick="showNextQuestion()">Nächste</button>
                </div>

            </div>
        </div>

    </main>
</body>

</html>
